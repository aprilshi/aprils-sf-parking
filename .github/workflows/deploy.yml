# Publishes public/ to GitHub Pages on every push, and every Monday refreshes
# street sweeping, meter rates and SFMTA holidays before publishing.
name: Refresh data & deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 13 * * 1"   # Mondays ~6am Pacific
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh data
        if: github.event_name != 'push'
        run: |
          python3 scripts/build_data.py
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "Refresh SF parking data" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
