<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <radialGradient id="skin" cx="0.45" cy="0.4" r="0.65"><stop offset="0" stop-color="#FFE3D0"/><stop offset="1" stop-color="#F5C6A5"/></radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#111"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e40af"/><stop offset="1" stop-color="#172554"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- road -->
  <rect x="0" y="430" width="512" height="82" fill="#374151"/>
  <rect x="40" y="466" width="60" height="10" rx="5" fill="#fbbf24"/><rect x="226" y="466" width="60" height="10" rx="5" fill="#fbbf24"/><rect x="412" y="466" width="60" height="10" rx="5" fill="#fbbf24"/>
  <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  <g clip-path="url(#clip)">
    <!-- girl: shirt -->
    <path d="M70 440 C70 370 110 340 175 340 C240 340 280 370 280 440 Z" fill="#a855f7"/>
    <!-- hair back (long) -->
    <path d="M84 225 C80 135 128 96 175 96 C224 96 272 135 266 225 C264 280 272 318 286 350 C262 368 236 360 222 345 L128 345 C114 360 88 368 64 350 C80 318 88 280 84 225 Z" fill="url(#hair)"/>
    <!-- neck -->
    <rect x="155" y="300" width="40" height="45" rx="12" fill="#F2BC98"/>
    <!-- face -->
    <ellipse cx="175" cy="230" rx="82" ry="90" fill="url(#skin)"/>
    <!-- bangs -->
    <path d="M93 222 C88 160 124 126 172 124 C222 122 262 156 257 222 C250 196 238 176 222 164 C196 190 146 196 112 190 C104 200 97 210 93 222 Z" fill="url(#hair)"/>
    <path d="M150 140 C170 132 196 132 214 142" stroke="#555" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5"/>
    <!-- eyes -->
    <ellipse cx="146" cy="240" rx="10" ry="14" fill="#1f1f1f"/><ellipse cx="204" cy="240" rx="10" ry="14" fill="#1f1f1f"/>
    <circle cx="149" cy="235" r="3.5" fill="#fff"/><circle cx="207" cy="235" r="3.5" fill="#fff"/>
    <!-- cheeks -->
    <ellipse cx="124" cy="272" rx="15" ry="9" fill="#FF9AA8" opacity=".6"/><ellipse cx="226" cy="272" rx="15" ry="9" fill="#FF9AA8" opacity=".6"/>
    <!-- smile -->
    <path d="M152 282 Q175 305 198 282" stroke="#7a3b2e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- car -->
    <path d="M300 330 L330 282 C336 272 344 268 356 268 L432 268 C444 268 452 273 458 283 L482 330 Z" fill="url(#car)" stroke="#dbeafe" stroke-width="5" stroke-linejoin="round"/>
    <path d="M320 328 L340 290 C343 285 347 283 353 283 L388 283 L388 328 Z" fill="#bfe3ff"/>
    <path d="M400 283 L430 283 C436 283 440 285 443 290 L462 328 L400 328 Z" fill="#bfe3ff"/>
    <rect x="276" y="322" width="226" height="84" rx="30" fill="url(#car)" stroke="#dbeafe" stroke-width="5"/>
    <rect x="279" y="325" width="220" height="12" rx="6" fill="url(#car)"/>
    <rect x="484" y="344" width="18" height="16" rx="6" fill="#fde68a"/>
    <rect x="280" y="344" width="14" height="16" rx="6" fill="#fca5a5"/>
    <rect x="390" y="344" width="22" height="7" rx="3.5" fill="#93c5fd" opacity=".7"/>
    <circle cx="330" cy="408" r="34" fill="#111"/><circle cx="330" cy="408" r="14" fill="#9ca3af"/>
    <circle cx="448" cy="408" r="34" fill="#111"/><circle cx="448" cy="408" r="14" fill="#9ca3af"/>
  </g>
</svg>
